<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anirex - AI Anime Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-black min-h-screen text-white overflow-x-hidden">
    <!-- Animated Neon Background -->
    <div class="fixed inset-0 bg-gradient-to-br from-gray-900 via-black to-gray-900">
        <div class="absolute inset-0 opacity-20">
            <div class="absolute top-20 left-10 w-72 h-72 bg-cyan-500/30 rounded-full blur-3xl animate-pulse"></div>
            <div class="absolute bottom-20 right-10 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl animate-pulse delay-1000"></div>
            <div class="absolute top-1/2 left-1/4 w-64 h-64 bg-pink-500/20 rounded-full blur-3xl animate-pulse delay-2000"></div>
        </div>
    </div>

    <div class="relative z-10 container mx-auto px-6 py-12 max-w-2xl">
        <!-- Header -->
        <div class="text-center mb-16">
            <h1 class="text-5xl md:text-7xl font-black bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent mb-6">
                ANIREX
            </h1>
            <p class="text-2xl opacity-90 mb-8 max-w-2xl mx-auto leading-relaxed">
                Stop scrolling. Start watching. <strong>Your perfect pick awaits.</strong>
            </p>
        </div>

        <!-- Main Form -->
        <form id="recommendForm" action="/recommend" method="POST" class="backdrop-blur-xl bg-gray-900/80 border border-gray-700/50 rounded-3xl p-10 shadow-2xl">
            <!-- Genre -->
            <div class="mb-8">
                <label class="block text-xl font-bold mb-4 text-cyan-400 flex items-center gap-3">
                    <i class="fas fa-tag text-2xl"></i>
                    Genre
                </label>
                <select name="genre" id="genre" required class="w-full p-6 text-xl bg-gray-800/50 border-2 border-gray-600 rounded-2xl focus:border-cyan-400 focus:ring-4 focus:ring-cyan-400/30 transition-all text-white">
                    <option value="" disabled selected>Choose your genre...</option>
                    <option value="Action">⚔️ Action</option>
                    <option value="Comedy">😂 Comedy</option>
                    <option value="Romance">💕 Romance</option>
                    <option value="Drama">🎭 Drama</option>
                    <option value="Slice of Life">🍙 Slice of Life</option>
                    <option value="Fantasy">🧙 Fantasy</option>
                    <option value="Sci-Fi">🚀 Sci-Fi</option>
                    <option value="Psychological">🧠 Psychological</option>
                    <option value="Horror">👻 Horror</option>
                </select>
            </div>

            <!-- Mood & Style -->
            <div class="grid md:grid-cols-2 gap-8 mb-8">
                <div>
                    <label class="block text-xl font-bold mb-4 text-purple-400 flex items-center gap-3">
                        <i class="fas fa-mood-happy text-2xl"></i>
                        Mood
                    </label>
                    <select name="mood" id="mood" class="w-full p-6 text-xl bg-gray-800/50 border-2 border-gray-600 rounded-2xl focus:border-purple-400 focus:ring-4 focus:ring-purple-400/30 transition-all text-white">
                        <option value="">Any mood</option>
                        <option value="Dark">🌑 Dark</option>
                        <option value="Wholesome">☀️ Wholesome</option>
                        <option value="Motivational">💪 Motivational</option>
                        <option value="Chill">😌 Chill</option>
                        <option value="Emotional">😢 Emotional</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xl font-bold mb-4 text-pink-400 flex items-center gap-3">
                        <i class="fas fa-palette text-2xl"></i>
                        Style
                    </label>
                    <select name="style" id="style" class="w-full p-6 text-xl bg-gray-800/50 border-2 border-gray-600 rounded-2xl focus:border-pink-400 focus:ring-4 focus:ring-pink-400/30 transition-all text-white">
                        <option value="">Any style</option>
                        <option value="Classic">📼 Classic</option>
                        <option value="Modern">✨ Modern</option>
                    </select>
                </div>
            </div>

            <!-- Reference Anime -->
            <div class="mb-10">
                <label class="block text-xl font-bold mb-4 text-yellow-400 flex items-center gap-3">
                    <i class="fas fa-search text-2xl"></i>
                    Similar to...
                </label>
                <input type="text" name="reference_title" id="reference_title" 
                       placeholder="You can leave this empty" 
                       class="w-full p-6 text-xl bg-gray-800/50 border-2 border-gray-600 rounded-2xl focus:border-yellow-400 focus:ring-4 focus:ring-yellow-400/30 transition-all text-white">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-black py-8 px-12 rounded-3xl text-2xl shadow-2xl hover:shadow-neon transition-all duration-300 transform hover:-translate-y-2">
                <span id="btnText" class="flex items-center justify-center gap-4">
                    <i class="fas fa-bolt text-3xl"></i>
                    Find My Perfect Anime
                </span>
            </button>
        </form>
    </div>

    <script>
        // Form submission with loading
        document.getElementById('recommendForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            if (!document.getElementById('genre').value) {
                alert('Please select a genre! 🎌');
                return false;
            }
            
            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin text-3xl"></i> AI Analyzing...';
        });
    </script>
</body>
</html>
